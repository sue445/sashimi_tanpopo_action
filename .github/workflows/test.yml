name: test

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  test-sashimi_tanpopo-version:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run sashimi_tanpopo version (Use latest version)
        uses: ./
        with:
          command: version

      - name: Run sashimi_tanpopo version (Use specified version)
        uses: ./
        with:
          command: version
          sashimi-tanpopo-version: 0.1.0

      - name: Slack Notification (not success)
        uses: act10ns/slack@d96404edccc6d6467fc7f8134a420c851b1e9054 # v2.2.0
        if: "! success()"
        continue-on-error: true
        with:
          status: ${{ job.status }}
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}

  test-sashimi_tanpopo-local:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run sashimi_tanpopo local
        uses: ./
        with:
          command:      "local"
          recipe-files: "test/recipe.rb"
          params:       "name:sue445 lang:ja"

      - name: Slack Notification (not success)
        uses: act10ns/slack@d96404edccc6d6467fc7f8134a420c851b1e9054 # v2.2.0
        if: "! success()"
        continue-on-error: true
        with:
          status: ${{ job.status }}
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}

  test-sashimi_tanpopo-github:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run sashimi_tanpopo github
        uses: ./
        with:
          command:           "github"
          recipe-files:      "test/recipe.rb"
          params:            "name:sue445 lang:ja"
          dry-run:           "true"
          git-user-name:     "sashimi_tanpopo"
          github-repository: "sue445/sashimi_tanpopo_action"
          message:           "Embed variables"
          pr-title:          "Embed variables"
          pr-source-branch:  "my_patch"
          pr-target-branch:  "main"
          pr-draft:          "true"
          arguments:         "--no-color"

      - name: Slack Notification (not success)
        uses: act10ns/slack@d96404edccc6d6467fc7f8134a420c851b1e9054 # v2.2.0
        if: "! success()"
        continue-on-error: true
        with:
          status: ${{ job.status }}
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run actionlint
        uses: reviewdog/action-actionlint@50842263c20a7c46bd0065b9e624d3c569db061e # v1.73.0
        with:
          fail_level: warning
          level: warning

      - name: Slack Notification (not success)
        uses: act10ns/slack@d96404edccc6d6467fc7f8134a420c851b1e9054 # v2.2.0
        if: "! success()"
        continue-on-error: true
        with:
          status: ${{ job.status }}
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}

  all-pass:
    if: always()

    needs:
      - test-sashimi_tanpopo-version
      - test-sashimi_tanpopo-local
      - test-sashimi_tanpopo-github
      - actionlint

    runs-on: ubuntu-slim

    steps:
      - name: check dependent jobs
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
