name: test

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  sashimi_tanpopo-version:
    name: "sashimi_tanpopo version"

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Run sashimi_tanpopo version (Use latest version)
        uses: ./
        with:
          command: version

      - name: Run sashimi_tanpopo version (Use specified version)
        uses: ./
        with:
          command: version
          sashimi-tanpopo-version: 0.1.0

      - name: Slack Notification (not success)
        uses: act10ns/slack@44541246747a30eb3102d87f7a4cc5471b0ffb7d # v2.1.0
        if: "! success()"
        continue-on-error: true
        with:
          status: ${{ job.status }}
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}

  sashimi_tanpopo-local:
    name: "sashimi_tanpopo local"

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Run sashimi_tanpopo local
        uses: ./
        with:
          command:      "local"
          recipe-files: "test/recipe.rb"
          params:       "name:sue445 lang:ja"

      - name: Slack Notification (not success)
        uses: act10ns/slack@44541246747a30eb3102d87f7a4cc5471b0ffb7d # v2.1.0
        if: "! success()"
        continue-on-error: true
        with:
          status: ${{ job.status }}
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}

  sashimi_tanpopo-github:
    name: "sashimi_tanpopo github"

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Run sashimi_tanpopo github
        uses: ./
        with:
          command:           "github"
          recipe-files:      "test/recipe.rb"
          params:            "name:sue445 lang:ja"
          dry-run:           "true"
          git-user-name:     "sashimi_tanpopo"
          github-repository: "sue445/sashimi_tanpopo_action"
          message:           "Embed variables"
          pr-title:          "Embed variables"
          pr-source-branch:  "my_patch"
          pr-target-branch:  "main"
          pr-draft:          "true"
          arguments:         "--no-color"

      - name: Slack Notification (not success)
        uses: act10ns/slack@44541246747a30eb3102d87f7a4cc5471b0ffb7d # v2.1.0
        if: "! success()"
        continue-on-error: true
        with:
          status: ${{ job.status }}
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Run actionlint
        uses: reviewdog/action-actionlint@83e4ed25b168066ad8f62f5afbb29ebd8641d982 # v1.69.1
        with:
          fail_level: warning
          level: warning

      - name: Slack Notification (not success)
        uses: act10ns/slack@44541246747a30eb3102d87f7a4cc5471b0ffb7d # v2.1.0
        if: "! success()"
        continue-on-error: true
        with:
          status: ${{ job.status }}
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}

  all-pass:
    if: always()

    needs:
      - sashimi_tanpopo-version
      - sashimi_tanpopo-local
      - sashimi_tanpopo-github
      - actionlint

    runs-on: ubuntu-slim

    steps:
      - name: check dependent jobs
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
